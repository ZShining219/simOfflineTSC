task:
  description: pure offline traffic signal control from frozen Plan 1 trajectories
  task_name: offline_tsc

world:
  interval: 1.0
  seed: 0
  dir: data/
  saveReplay: False
  report_log_mode: normal
  report_log_rate: 10
  no_warning: True
  gui: False
  rlTrafficLight: True

trainer:
  thread: 4
  ngpu: -1
  learning_start: 0
  buffer_size: 1
  steps: 3600
  test_steps: 3600
  yellow_length: 5
  action_interval: 10
  episodes: 144000
  total_updates: 144000
  target_update_interval: 10
  update_model_rate: 1
  update_target_rate: 10
  test_when_train: False
  log_interval: 100
  evaluation_updates: [0, 14400, 36000, 72000, 108000, 144000]

model:
  name: offline_dqn
  train_model: True
  test_model: True
  load_model: False
  graphic: False
  vehicle_max: 1
  learning_rate: 0.001
  batch_size: 64
  gamma: 0.95
  epsilon: 0.0
  epsilon_decay: 1.0
  epsilon_min: 0.0
  grad_clip: 5.0
  one_hot: True
  phase: True
  offline_backend: d3rlpy
  cql_alpha: 0.0

logger:
  root_dir: data/output_data/
  log_dir: logger/
  replay_dir: replay/
  model_dir: model/
  data_dir: dataset/
  save_model: True
  save_rate: 1
  attention: False
