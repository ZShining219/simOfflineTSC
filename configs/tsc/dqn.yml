includes:
  - configs/tsc/base.yml

model:
  name: dqn
  train_model: True
  epsilon: 0.1
  epsilon_decay: 0.995
  epsilon_min: 0.01
  one_hot: True
  phase: True

trainer:
  episodes: 5
  learning_start: 1000
  buffer_size: 5000
  evaluation_episodes: [0, 1, 2, 3, 4, 5]
  resumable_checkpoint_episodes: [0, 5]
