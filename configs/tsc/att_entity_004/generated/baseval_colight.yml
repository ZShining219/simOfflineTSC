# ATT-ENTITY-004 baseline eval: CoLight frozen ckpt, eval-only under the
# shared random-v1 plan (eval schedule = compound event 900-1200s).
model:
  name: colight
  train_model: True
  epsilon: 0.8
  epsilon_decay: 0.99995
  epsilon_min: 0.05
  batch_size: 8

trainer:
  episodes: 0
  steps: 3600
  test_steps: 3600
  learning_start: 1000
  buffer_size: 5000
  action_interval: 10
  update_model_rate: 1
  update_target_rate: 10
  test_when_train: false
  evaluation_episodes: [0]
  resumable_checkpoint_episodes: [0]
  event_schedule_plan: configs/events/plans/hz4x4_random_v1.yml

logger:
  save_rate: 25
  attention: false
