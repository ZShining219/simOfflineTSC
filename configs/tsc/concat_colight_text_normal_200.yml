# Formal 200-episode N-train Concat-CoLight profile.  experiment-config
# overlays do NOT resolve `includes`, so every parameter is written explicitly
# and must stay identical to concat_colight_text_event_200.yml except
# event_schedule.
model:
  name: concat_colight
  train_model: True
  sga_enabled: True
  sga_input_mode: concat
  sga_meta_dim: 64
  sga_attention_dim: 64
  sga_temperature: 1.0
  sga_residual_scale: 1.0
  sga_grounding_bias: 1.0
  epsilon: 0.8
  epsilon_decay: 0.99995
  epsilon_min: 0.05
  batch_size: 8

trainer:
  episodes: 200
  steps: 3600
  test_steps: 3600
  learning_start: 1000
  buffer_size: 5000
  action_interval: 10
  update_model_rate: 1
  update_target_rate: 10
  test_when_train: false
  evaluation_episodes: [0, 50, 100, 150, 200]
  resumable_checkpoint_episodes: [0, 50, 100, 150, 200]
  event_schedule: configs/events/none.yml

logger:
  save_rate: 25
  attention: false
