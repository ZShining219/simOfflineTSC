# Stage-1 gate-opening diagnostic: short run over the shared plan with dense
# checkpoints so branch_norm trajectory, gradient norms and counterfactual
# probes can be read per episode.  Self-contained overlay.
model:
  name: sga_flx_colight
  train_model: True
  sga_enabled: True
  sga_input_mode: text_multi_event_flx
  sga_meta_dim: 64
  sga_attention_dim: 64
  sga_flx_heads: 4
  sga_grounding_bias: 1.0
  epsilon: 0.8
  epsilon_decay: 0.99995
  epsilon_min: 0.05
  batch_size: 8

trainer:
  episodes: 60
  steps: 3600
  test_steps: 3600
  learning_start: 1000
  buffer_size: 5000
  action_interval: 10
  update_model_rate: 1
  update_target_rate: 10
  test_when_train: false
  evaluation_episodes: [0, 15, 30, 45, 60]
  resumable_checkpoint_episodes: [0, 15, 30, 45, 60]
  event_schedule_plan: configs/events/plans/hz4x4_random_v1.yml

logger:
  save_rate: 10
  attention: true
