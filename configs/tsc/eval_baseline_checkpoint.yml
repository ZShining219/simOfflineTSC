# Evaluation-only overlay for tools/eval_baseline_checkpoint.py.
# Use when the training run used the legacy Intersection.pseudo_step
# semantics.  For corrected green/yellow execution use the _gy5 variant.
model:
  train_model: false
  test_model: true
  load_model: false

trainer:
  episodes: 1
  steps: 3600
  test_steps: 3600
  action_interval: 10
  learning_start: -1
  test_when_train: false
  evaluation_episodes: [0, 1]
  resumable_checkpoint_episodes: [0, 1]

logger:
  save_model: false

world:
  saveReplay: false
