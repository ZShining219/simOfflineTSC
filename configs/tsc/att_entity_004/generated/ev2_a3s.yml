# eval_v2 protocol config — a3s arm (plain structaux; no fusion_gate/guard).
# Frozen-ckpt rollouts via tools/run_tarl_struct_cf.py --eval_protocol eval_v2:
# plan episode e runs SUMO with --seed sumo_seed+e (trainer.sumo_seed_per_episode),
# so one run yields a paired demand realisation per plan episode.
model:
  name: tarl_attention
  train_model: True
  tarl_impl: paper
  one_hot: True
  phase: True
  batch_size: 128
  gamma: 0.99
  learning_rate: 0.0001
  epsilon: 0.8
  epsilon_decay: 0.99995
  epsilon_min: 0.05
  grad_clip: 5.0
  event_input: structured
  semantic_aux:
    enabled: true
    lambda: 1.0
  grad_ledger: true
  grad_probe_interval: 0

trainer:
  episodes: 40
  steps: 3600
  test_steps: 3600
  learning_start: 1000000000
  buffer_size: 50000
  action_interval: 10
  update_model_rate: 1
  update_target_rate: 200
  test_when_train: false
  # evaluation_episodes intentionally omitted: eval_v2 harvests the 40
  # train-role rollouts; no eval-role episodes are wanted (they would shift
  # the dump-npz <-> plan-episode alignment).
  event_schedule_plan: configs/events/plans/hz4x4_random_v1.yml
  sumo_seed_per_episode: true

logger:
  save_rate: 25
