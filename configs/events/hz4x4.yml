# Deterministic integration scenario, not a calibrated research distribution.
# Times are seconds; intervals are [begin, end). No report delay.
# A road_closure closes ONE directed edge, with no forced rerouting.
# Rain is a global speed-limit proxy. Overlapping rain uses the lowest factor.
schema_version: sumo-events-v1
events:
  - event_id: hz_lane_01
    kind: lane_blockage
    begin: 60
    end: 120
    lane_id: road_1_1_0_2
    position: 650
    position_tolerance: 20
  - event_id: hz_road_01
    kind: road_closure
    begin: 150
    end: 210
    edge_id: road_2_2_0
  - event_id: hz_rain_01
    kind: global_rain
    begin: 90
    end: 240
    speed_factor: 0.7
