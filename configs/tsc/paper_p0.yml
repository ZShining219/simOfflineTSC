# Engineering gate only; not a pilot or formal training budget.
# CLI --seed sets the independent training RNG; command.sumo_seed controls SUMO.
command:
  sumo_seed: 7
trainer:
  episodes: 2
  steps: 300
  test_steps: 300
  learning_start: 5
  buffer_size: 100
  evaluation_episodes: [0, 2]
  resumable_checkpoint_episodes: [0, 2]
  action_interval: 10
  event_schedule: configs/events/hz4x4.yml
  signal_control:
    version: sumo-green-yellow-v1
    yellow_seconds: 5
model:
  batch_size: 4
world:
  saveReplay: false
logger:
  save_rate: 1
