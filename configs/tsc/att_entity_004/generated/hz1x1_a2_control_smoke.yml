model:
  name: tarl_attention
  train_model: true
  tarl_impl: paper
  one_hot: true
  phase: true
  batch_size: 128
  gamma: 0.99
  learning_rate: 0.0001
  epsilon: 0.8
  epsilon_decay: 0.99995
  epsilon_min: 0.05
  grad_clip: 5.0
  event_input: structured
  comment: hz1x1 quick validation (a2_control, ep40 short-run; conditional behavior
    not convergence)
trainer:
  episodes: 2
  steps: 3600
  test_steps: 3600
  learning_start: 1000
  buffer_size: 50000
  action_interval: 10
  update_model_rate: 1
  update_target_rate: 200
  test_when_train: false
  evaluation_episodes:
  - 0
  - 2
  resumable_checkpoint_episodes:
  - 0
  - 2
  event_schedule_plan: configs/events/plans/hz1x1_single_v1.yml
logger:
  save_rate: 25
