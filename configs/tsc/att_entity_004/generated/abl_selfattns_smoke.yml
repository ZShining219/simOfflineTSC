logger: {save_rate: 25}
model:
  batch_size: 128
  epsilon: 0.8
  epsilon_decay: 0.99995
  epsilon_min: 0.05
  event_input: structured
  gamma: 0.99
  grad_clip: 5.0
  grad_ledger: true
  grad_probe_interval: 0
  learning_rate: 0.0001
  name: tarl_selfattn
  one_hot: true
  phase: true
  semantic_aux: {enabled: true, lambda: 1.0}
  tarl_impl: paper
  train_model: true
trainer:
  action_interval: 10
  buffer_size: 50000
  episodes: 2
  evaluation_episodes: [0, 2]
  event_schedule_plan: configs/events/plans/hz4x4_random_v1.yml
  learning_start: 100
  resumable_checkpoint_episodes: [0, 2]
  steps: 3600
  test_steps: 3600
  test_when_train: false
  update_model_rate: 1
  update_target_rate: 200
