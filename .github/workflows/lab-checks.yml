# 仓库治理检查：与本地提交闸门同口径，防止绕过 hook（--no-verify）或未启用 hook 的克隆把问题带进远端。
# 只依赖标准库 + pytest，不安装仿真器与训练依赖。
name: lab-checks
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install pytest
      - name: 结构检查（符号链接、产物入库）
        run: python -m lab check --all
      - name: 台账、架构棘轮与 lab 测试
        run: >-
          python -m pytest -q tests/test_lab_checks.py tests/test_ledger_schema.py
          tests/test_architecture.py tests/test_lab_metrics.py tests/test_lab_registry.py tests/test_lab.py
