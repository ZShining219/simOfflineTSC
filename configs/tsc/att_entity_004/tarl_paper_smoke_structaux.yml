# ATT-ENTITY-004 structured-line smoke: 4ep x 300s alignment plan.
# Exercises the structured event slot (lane_blockage / multi / rain / Normal),
# the semantic aux head + masked losses, and utility-condition plumbing
# end-to-end before the A2/A3 pilots.
model:
  name: tarl_attention
  train_model: True
  tarl_impl: paper
  one_hot: True
  phase: True
  batch_size: 8
  gamma: 0.99
  learning_rate: 0.0001
  epsilon: 0.8
  epsilon_decay: 0.99995
  epsilon_min: 0.05
  grad_clip: 5.0
  event_input: structured
  semantic_aux:
    enabled: true
    lambda: 1.0
  # ledger carries aux_present_acc / aux_type_acc / aux_loss every step;
  # gradient probe disabled for the structured line.
  grad_ledger: true
  grad_probe_interval: 0

trainer:
  episodes: 4
  steps: 300
  test_steps: 300
  learning_start: 5
  buffer_size: 5000
  action_interval: 10
  update_model_rate: 1
  update_target_rate: 200
  test_when_train: false
  evaluation_episodes: [0, 4]
  resumable_checkpoint_episodes: [0, 4]
  event_schedule_plan: configs/events/plans/hz4x4_align_smoke_v1.yml

logger:
  save_rate: 1
