# eval_v2 protocol config — closure_bind arm (fixG family + closure_binding
# nearest_upstream; matches att004_closure_bind_200.yml).
# matching att004_fixG_200.yml).  Frozen-ckpt rollouts via
# tools/run_tarl_struct_cf.py --eval_protocol eval_v2: plan episode e runs
# SUMO with --seed sumo_seed+e (trainer.sumo_seed_per_episode).
model:
  batch_size: 128
  epsilon: 0.8
  epsilon_decay: 0.99995
  epsilon_min: 0.05
  event_input: structured
  gamma: 0.99
  grad_clip: 5.0
  grad_ledger: true
  grad_probe_interval: 0
  huber_beta: 10.0
  learning_rate: 0.0001
  name: tarl_attention
  one_hot: true
  phase: true
  semantic_aux: {enabled: true, lambda: 1.0}
  fusion_gate: true
  closure_binding: nearest_upstream
  starvation_guard: {enabled: true, t_max_s: 180.0, theta: 30.0}
  tarl_impl: paper
  td_loss_fn: huber
  train_model: true

trainer:
  episodes: 40
  steps: 3600
  test_steps: 3600
  learning_start: 1000000000
  buffer_size: 50000
  action_interval: 10
  update_model_rate: 1
  update_target_rate: 200
  test_when_train: false
  # evaluation_episodes intentionally omitted: eval_v2 harvests the 40
  # train-role rollouts; no eval-role episodes are wanted (they would shift
  # the dump-npz <-> plan-episode alignment).
  event_schedule_plan: configs/events/plans/hz4x4_random_v1.yml
  sumo_seed_per_episode: true

logger:
  save_rate: 25
