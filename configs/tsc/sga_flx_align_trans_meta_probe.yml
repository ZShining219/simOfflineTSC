# Retrieval probe for frozen B' (meta-repr transition) checkpoints (stage 4).
# Identical to sga_flx_align_trans_probe.yml except sga_align_event_repr: meta
# so the meta projection module exists and checkpoint weights load.
model:
  name: sga_flx_colight
  train_model: False
  sga_enabled: True
  sga_input_mode: text_multi_event_flx
  sga_meta_dim: 64
  sga_attention_dim: 64
  sga_flx_heads: 4
  sga_grounding_bias: 1.0
  sga_align_lambda: 0.1
  sga_align_tau: 0.07
  sga_align_window_cap_steps: 60
  sga_align_min_active_steps: 3
  sga_align_max_events: 16
  sga_align_min_events: 2
  sga_align_buffer_episodes: 32
  sga_align_mode: transition
  sga_align_event_repr: meta
  sga_align_seed: 1301
  batch_size: 8

trainer:
  episodes: 1
  steps: 1500
  test_steps: 1500
  learning_start: 100000
  buffer_size: 500
  action_interval: 10
  update_model_rate: 1
  update_target_rate: 10
  test_when_train: false
  event_schedule: configs/events/eval/all.yml

logger:
  save_rate: 1
  attention: true
