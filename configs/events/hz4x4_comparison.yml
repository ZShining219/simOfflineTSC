# Quantitative mechanism comparison, separate from the short integration smoke.
# Same locations/intensity as hz4x4.yml; traffic develops for 900 s first.
# All single-event conditions and the combination use the same [900, 1200) window.
# This is a controlled scenario, not an empirical incident/weather distribution.
schema_version: sumo-events-v1
events:
  - event_id: hz_lane_01
    kind: lane_blockage
    begin: 900
    end: 1200
    lane_id: road_1_1_0_2
    position: 650
    position_tolerance: 20
  - event_id: hz_road_01
    kind: road_closure
    begin: 900
    end: 1200
    edge_id: road_2_2_0
  - event_id: hz_rain_01
    kind: global_rain
    begin: 900
    end: 1200
    speed_factor: 0.7
