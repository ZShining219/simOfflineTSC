# Live-fire smoke for SGA-FLX over the episode plan.  Self-contained because
# experiment-config overlays do NOT resolve `includes`.  One 1000-second
# episode lets plan row 0's road_closure (begin 665s) physically fire and
# produce reports/grounding mid-episode.
model:
  name: sga_flx_colight
  sga_enabled: True
  sga_input_mode: text_multi_event_flx
  sga_meta_dim: 64
  sga_attention_dim: 64
  sga_flx_heads: 4
  sga_grounding_bias: 1.0
  batch_size: 8

trainer:
  episodes: 1
  steps: 1000
  test_steps: 1000
  learning_start: 20
  buffer_size: 500
  action_interval: 10
  update_model_rate: 1
  update_target_rate: 10
  test_when_train: false
  event_schedule_plan: configs/events/plans/hz4x4_random_v1.yml

logger:
  save_rate: 1
  attention: true
