# TARL-ATT (paper-faithful impl) on the SHARED random episode plan.
# 200-episode training, hz4x4, identical control/eval settings to the
# colight/sga_flx 200ep arms; model-internal hyperparameters follow the paper
# (gamma 0.99, batch 128, buffer 50k, target sync every 200 decisions, lr 1e-4).
# Text is delivered by the project event runtime (broadcast public reports);
# the TARL-internal runtime stays at 'normal' (no events). Encoder:
# frozen bert-base-uncased (paper specifies all-mpnet-base-v2; offline asset).
model:
  name: tarl_attention
  train_model: True
  tarl_impl: paper
  one_hot: True
  phase: True
  batch_size: 128
  gamma: 0.99
  learning_rate: 0.0001
  epsilon: 0.8
  epsilon_decay: 0.99995
  epsilon_min: 0.05
  grad_clip: 5.0

trainer:
  episodes: 200
  steps: 3600
  test_steps: 3600
  learning_start: 1000
  buffer_size: 50000
  action_interval: 10
  update_model_rate: 1
  update_target_rate: 200
  test_when_train: false
  evaluation_episodes: [0, 50, 100, 150, 200]
  resumable_checkpoint_episodes: [0, 50, 100, 150, 200]
  event_schedule_plan: configs/events/plans/hz4x4_random_v1.yml

logger:
  save_rate: 25
