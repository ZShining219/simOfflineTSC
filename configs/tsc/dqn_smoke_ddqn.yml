# DDQN engineering smoke (same DQN agent; double-target flag only).
model:
  double_dqn: true
  batch_size: 8

trainer:
  episodes: 1
  steps: 300
  test_steps: 300
  learning_start: 10
  buffer_size: 100
  evaluation_episodes: [0, 1]
  resumable_checkpoint_episodes: [0, 1]
  test_when_train: false

logger:
  save_model: false

world:
  saveReplay: false
