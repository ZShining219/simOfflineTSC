includes:
  - configs/tsc/sga_flx_colight.yml

# Engineering smoke for SGA-FLX over a frozen episode plan.  Three episodes
# cover road_closure, closure+blockage, and rain rows of the shared plan.
model:
  name: sga_flx_colight
  sga_input_mode: text_multi_event_flx
  sga_meta_dim: 64
  sga_attention_dim: 64
  sga_flx_heads: 4
  sga_grounding_bias: 1.0
  batch_size: 8

trainer:
  episodes: 3
  steps: 300
  test_steps: 300
  learning_start: 20
  buffer_size: 500
  action_interval: 10
  update_model_rate: 1
  update_target_rate: 10
  test_when_train: false
  event_schedule_plan: configs/events/plans/hz4x4_random_v1.yml

logger:
  save_rate: 1
  attention: true
