# w34_3 baseline eval_v2: CoLight frozen ckpt (colight_event_200_s7 ep200)
# under the shared eval_v2 frozen eval set.  att004_baseline_eval.py loads
# the checkpoint into agent.model and redirects sample() to the greedy
# policy; train_model stays true only to keep the registry happy — the tool
# neuters remember/train so nothing updates.
model:
  name: colight
  train_model: True
  epsilon: 0.8
  epsilon_decay: 0.99995
  epsilon_min: 0.05
  batch_size: 8

trainer:
  episodes: 40
  steps: 3600
  test_steps: 3600
  learning_start: 1000
  buffer_size: 5000
  action_interval: 10
  update_model_rate: 1
  update_target_rate: 10
  test_when_train: false
  event_schedule_plan: configs/events/plans/hz4x4_random_v1.yml
  sumo_seed_per_episode: true

logger:
  save_rate: 25
  attention: false
