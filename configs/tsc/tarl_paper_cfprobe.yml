# Frozen-checkpoint text counterfactual probe for paper-faithful TARL.
# One 3600 s episode on the fixed eval schedule (events confined to
# [900,1200): before/during/after contrast).  learning_start 0 so the patched
# get_action runs from the first decision; update_model_rate huge so no
# gradient step can touch the loaded weights.  Model section must match the
# trained run's architecture (tarl_impl: paper).
model:
  name: tarl_attention
  train_model: True
  tarl_impl: paper
  one_hot: True
  phase: True
  batch_size: 128
  gamma: 0.99
  learning_rate: 0.0001
  epsilon: 0.0
  epsilon_decay: 1.0
  epsilon_min: 0.0
  grad_clip: 5.0

trainer:
  episodes: 1
  steps: 3600
  test_steps: 3600
  learning_start: 0
  buffer_size: 8
  action_interval: 10
  update_model_rate: 999999
  update_target_rate: 999999
  test_when_train: false
  event_schedule: configs/events/eval/all.yml

logger:
  save_rate: 999999
